name: lista_pro
description: ListaPro — Sistema Inteligente de Gestão de Listas de Compras
publish_to: 'none'
version: 1.1.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.1

  # Firebase
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.6
  cloud_firestore: ^4.17.3
  firebase_messaging: ^14.9.1
  firebase_crashlytics: ^3.5.5
  firebase_analytics: ^10.10.5
  firebase_storage: ^11.7.5

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network
  connectivity_plus: ^6.0.3
  dio: ^5.4.3+1

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Code generation / serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UUID
  uuid: ^4.4.0

  # Internationalization
  intl: ^0.19.0

  # Utilities
  equatable: ^2.0.5
  logger: ^2.3.0
  collection: ^1.18.0

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  badges: ^3.1.2
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.3
  fake_cloud_firestore: ^2.5.1

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icone_compry.png"
  adaptive_icon_background: "#2e7d32"
  adaptive_icon_foreground: "assets/icons/icone_compry.png"
