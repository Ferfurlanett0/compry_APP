<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Compry — Sistema de Lista de Compras Premium">

  <!-- iOS meta tags & icons -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F19">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compry">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html, body {
      background-color: #0B0F19;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #splash-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0B0F19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      animation: pulse 1.8s infinite ease-in-out;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(16, 185, 129, 0.15);
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>

  <script>
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPrompt = e;
      console.log('beforeinstallprompt captured by Compry');
    });

    window.triggerPwaInstall = function() {
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        window.deferredPrompt.userChoice.then(function(choiceResult) {
          console.log('User choice: ' + choiceResult.outcome);
          window.deferredPrompt = null;
        });
        return true;
      }
      return false;
    };
  </script>
</head>
<body>
  <div id="splash-loading">
    <img src="icons/Icon-192.png" class="splash-logo" alt="Compry" />
    <div class="splash-spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('load', function() {
      var checkFlutter = setInterval(function() {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
          clearInterval(checkFlutter);
          var splash = document.getElementById('splash-loading');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(function() { splash.remove(); }, 400);
          }
        }
      }, 100);
    });
  </script>
</body>
</html>
