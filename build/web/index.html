<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Compry — Sistema de Lista de Compras Premium">

  <!-- iOS meta tags & icons -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F19">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compry">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Compry</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #0B0F19;
      touch-action: manipulation;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      background: #0B0F19;
      color: #FFFFFF;
      font: 600 14px system-ui, -apple-system, sans-serif;
      pointer-events: none;
      transition: opacity 180ms ease-out;
    }

    #app-loading img {
      width: 76px;
      height: 76px;
      border-radius: 18px;
    }

    #app-loading.ready {
      opacity: 0;
    }
  </style>

  <script>
    window.__compryPwaEvents = [];
    window.compryPwaDiagnostic = function(name, details) {
      const event = {
        name: name,
        at: Math.round(performance.now()),
        visibility: document.visibilityState,
        standalone: window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true,
        details: details || null
      };
      window.__compryPwaEvents.push(event);
      if (window.__compryPwaEvents.length > 80) {
        window.__compryPwaEvents.shift();
      }
      console.debug('[Compry PWA]', event);
    };

    window.compryAppReady = function() {
      window.compryPwaDiagnostic('first-frame-ready');
      document.documentElement.dataset.compryReady = 'true';
      const loading = document.getElementById('app-loading');
      if (loading) {
        loading.classList.add('ready');
        setTimeout(function() { loading.remove(); }, 220);
      }
      requestAnimationFrame(function() {
        window.dispatchEvent(new Event('resize'));
      });
    };

    window.addEventListener('pageshow', function(event) {
      window.compryPwaDiagnostic('pageshow', { persisted: event.persisted });
      requestAnimationFrame(function() {
        window.dispatchEvent(new Event('resize'));
      });
    });

    document.addEventListener('visibilitychange', function() {
      window.compryPwaDiagnostic('visibilitychange');
      if (document.visibilityState === 'visible') {
        requestAnimationFrame(function() {
          window.dispatchEvent(new Event('resize'));
        });
      }
    });

    window.addEventListener('pointerdown', function(event) {
      window.compryPwaDiagnostic('pointerdown', {
        pointerType: event.pointerType,
        x: Math.round(event.clientX),
        y: Math.round(event.clientY)
      });
    }, { capture: true, passive: true });

    window.addEventListener('touchstart', function(event) {
      window.compryPwaDiagnostic('touchstart', {
        touches: event.touches.length
      });
    }, { capture: true, passive: true });

    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPrompt = e;
      console.log('beforeinstallprompt captured by Compry');
    });

    window.triggerPwaInstall = function() {
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        window.deferredPrompt.userChoice.then(function(choiceResult) {
          console.log('User choice: ' + choiceResult.outcome);
          window.deferredPrompt = null;
        });
        return true;
      }
      return false;
    };
  </script>
</head>
<body>
  <div id="app-loading" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <span>Carregando...</span>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
